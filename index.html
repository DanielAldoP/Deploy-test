<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open API Data Viewer with Check Digit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .image-container {
            margin-bottom: 20px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        .artist-info {
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div id="app"></div>

<!-- Form for Check Digit Validation -->
<h2>Check Digit Validator</h2>
<form id="checkDigitForm">
    <label for="pan">Enter PAN:</label>
    <input type="text" id="pan" name="pan" required>
    <button type="submit">Check Digit</button>
</form>

<div id="checkDigitResult"></div>

<script>
    // Function to fetch data from the API
    async function fetchData() {
        try {
            const response = await fetch('https://rich-blue-dugong-vest.cyclic.app/waifu');
            const data = await response.json();
            return data;
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    }

    // Function to render the data on the page
    async function renderData() {
        var appElement = document.getElementById('app');
        var data = await fetchData();

        data.images.forEach(function (image) {
            var imageContainer = document.createElement('div');
            imageContainer.classList.add('image-container');

            var imageElement = document.createElement('img');
            imageElement.src = image.url;
            imageElement.alt = 'Image';

            var artistInfo = document.createElement('div');
            artistInfo.classList.add('artist-info');
            artistInfo.innerHTML = '<strong>Artist:</strong> ' + image.artist.name;

            imageContainer.appendChild(imageElement);
            imageContainer.appendChild(artistInfo);

            appElement.appendChild(imageContainer);
        });
    }

    // Check Digit Function
    function checkDigit(number) {
        let stack = 0;
        number = ("" + number).split('').reverse();
        let tempn;
        let tempsum = 0;
        
        for (let [key, value] of Object.entries(number)) {
            if (key % 2 == 0) {
                tempn = ("" + (parseInt(value) * 2)).split('');
                tempsum = 0;
                for (let tjum of tempn) tempsum += parseInt(tjum);
                value = tempsum;
            }
            stack += parseInt(value);
        }

        let temp = stack;
        stack %= 10;

        if (stack != 0) stack -= 10;

        return (temp + Math.abs(stack)) % 10 === 0 ? Math.abs(stack) : false;
    }

    // Handle Check Digit Form Submission
    document.getElementById('checkDigitForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const pan = document.getElementById('pan').value;
        const result = checkDigit(pan);
        
        const resultDiv = document.getElementById('checkDigitResult');
        resultDiv.innerHTML = '';

        if (result === false) {
            resultDiv.textContent = 'Invalid PAN: Check digit does not match.';
        } else {
            resultDiv.textContent = 'Check Digit: ' + result;
        }
    });

    // Call the renderData function to initiate the process
    renderData();
</script>

</body>
</html>
