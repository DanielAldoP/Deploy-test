<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open API Data Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .image-container {
            margin-bottom: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .artist-info {
            margin-top: 10px;
        }

        .check-digit-result {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div id="app"></div>

<!-- Check Digit Form -->
<h2>Check Digit Validator</h2>
<form id="checkDigitForm">
    <label for="pan">Enter PAN:</label>
    <input type="text" id="pan" name="pan" required>
    <button type="submit">Check Digit</button>
</form>

<div id="checkDigitResult" class="check-digit-result"></div>

<script>
    // Function to fetch data from the API
    async function fetchData() {
        try {
            const response = await fetch('https://rich-blue-dugong-vest.cyclic.app/waifu');
            const data = await response.json();
            return data;
        } catch (error) {
            console.error('Error fetching data:', error);
        }
    }

    // Function to render the data on the page
    async function renderData() {
        var appElement = document.getElementById('app');
        var data = await fetchData();

        data.images.forEach(function (image) {
            var imageContainer = document.createElement('div');
            imageContainer.classList.add('image-container');

            var imageElement = document.createElement('img');
            imageElement.src = image.url;
            imageElement.alt = 'Image';

            var artistInfo = document.createElement('div');
            artistInfo.classList.add('artist-info');
            artistInfo.innerHTML = '<strong>Artist:</strong> ' + image.artist.name;

            imageContainer.appendChild(imageElement);
            imageContainer.appendChild(artistInfo);

            appElement.appendChild(imageContainer);
        });
    }

    // Call the renderData function to initiate the process
    renderData();

    // Check Digit Validator
    document.getElementById('checkDigitForm').addEventListener('submit', async function(event) {
        event.preventDefault();
        const pan = document.getElementById('pan').value;

        try {
            const response = await fetch('/check-digit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pan })
            });
            const result = await response.json();
            displayCheckDigitResult(result);
        } catch (error) {
            displayCheckDigitResult({ error: error.message });
        }
    });

    function displayCheckDigitResult(result) {
        const checkDigitResultDiv = document.getElementById('checkDigitResult');
        checkDigitResultDiv.innerHTML = '';

        if (result.error) {
            checkDigitResultDiv.textContent = `Error: ${result.error}`;
        } else {
            checkDigitResultDiv.textContent = `Check Digit Result: ${result}`;
        }
    }
</script>

</body>
</html>
