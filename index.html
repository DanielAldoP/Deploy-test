<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Digit Validator</title>
</head>
<body>

<h2>Check Digit Validator</h2>
<form id="checkDigitForm">
    <label for="pan">Enter PAN:</label>
    <input type="text" id="pan" name="pan" required>
    <button type="submit">Check Digit</button>
</form>

<div id="checkDigitResult"></div>

<script>
    // JavaScript to handle the form submission
    document.getElementById('checkDigitForm').addEventListener('submit', async function(event) {
        // Prevents the default form submission
        event.preventDefault();

        // Get the PAN value from the input box
        const pan = document.getElementById('pan').value;

        // Fetch request with the PAN in the query parameter
        try {
            // Update the URL to your server’s endpoint
            const response = await fetch(`/check-digit?pan=${encodeURIComponent(pan)}`, {
                method: 'GET'
            });

            // Parse the response as JSON
            const result = await response.json();
            displayCheckDigitResult(result);
        } catch (error) {
            displayCheckDigitResult({ error: error.message });
        }
    });

    // Function to display the check digit result
    function displayCheckDigitResult(result) {
        const checkDigitResultDiv = document.getElementById('checkDigitResult');
        checkDigitResultDiv.innerHTML = '';

        if (result.error) {
            checkDigitResultDiv.textContent = `Error: ${result.error}`;
        } else {
            checkDigitResultDiv.textContent = `Check Digit Result: ${result.result}`;
        }
    }
</script>

</body>
</html>
